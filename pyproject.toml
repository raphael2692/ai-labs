[project]
name = "ai-lab"
version = "0.1.0"
description = "Personal AI lab workspace: Unsloth LLM server, Whisper ASR server, and Streamlit apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# servers/unsloth is intentionally excluded: it's driven by a globally-installed
# `unsloth` CLI (see servers/unsloth/README.md), not a Python/uv project.
members = ["servers/*", "apps/*"]
exclude = ["servers/unsloth"]
