[project]
name = "whisper-server"
version = "0.1.0"
description = "Local/remote GPU-backed Whisper ASR HTTP server (faster-whisper + FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.2.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
