[project]
name = "ocr-server"
version = "0.1.0"
description = "Local/remote GPU-backed OCR HTTP server (baidu/Unlimited-OCR via transformers + FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Pinned exactly (not >=): the model's trust_remote_code files are only
    # compatible with the versions the model card was tested against — a
    # newer transformers (5.x) drops APIs that code relies on.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.1",
    "Pillow==12.1.1",
    "matplotlib==3.10.8",
    "einops==0.8.2",
    "addict==2.4.0",
    "easydict==1.13",
    "pymupdf==1.27.2.2",
    "psutil==7.2.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.uv]
package = false
