[project]
name = "ai-lab-common"
version = "0.1.0"
description = "Shared config and HTTP clients for ai-lab Streamlit apps (Whisper + Unsloth endpoints)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.60.0",
    "openai>=2.50.0",
    "requests>=2.32",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_lab_common"]
